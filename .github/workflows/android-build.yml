name: AI Auto Trader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract project
        run: |
          mkdir -p build-source
          unzip -q ai-auto-trader-source.zip -d build-source
          echo "Extracted files:"
          find build-source -maxdepth 4 -type f | sort

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Android APK
        working-directory: build-source/ai-auto-trader/android
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-auto-trader-testnet-apk
          path: build-source/ai-auto-trader/android/app/build/outputs/apk/debug/*.apk

      - name: Run backend tests
        working-directory: build-source/ai-auto-trader/backend
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q
